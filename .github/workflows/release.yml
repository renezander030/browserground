name: Release

# Tag-driven release: bump the version, commit, then push a matching tag (e.g. v1.2.3).
# npm/ and pypi/ must carry the same version.
# Publishes through npm and PyPI trusted publishing (GitHub OIDC): no tokens or repo secrets.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  npm:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write   # npm trusted publishing + provenance
    defaults:
      run:
        working-directory: npm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'
      - run: node bin/browserground.js --help
      - run: npm pack --dry-run --ignore-scripts

      - name: Verify tag matches package.json version
        run: |
          PKG="v$(node -p "require('./package.json').version")"
          if [ "$PKG" != "${GITHUB_REF_NAME}" ]; then
            echo "tag ${GITHUB_REF_NAME} != package.json ${PKG}" >&2
            exit 1
          fi

      - name: npm 11 for trusted publishing
        run: npm install -g npm@11.12.1

      - name: Publish to npm with provenance
        run: npm publish --provenance --access public

  pypi:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write   # PyPI trusted publishing
    defaults:
      run:
        working-directory: pypi
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Verify tag matches pyproject version
        run: |
          V="v$(python3 -c "import tomllib;print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")"
          if [ "$V" != "${GITHUB_REF_NAME}" ]; then
            echo "tag ${GITHUB_REF_NAME} != pyproject ${V}" >&2
            exit 1
          fi
      - run: python3 -m pip install --upgrade build && python3 -m build
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: pypi/dist

  github-release:
    needs: [npm, pypi]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release view "$GITHUB_REF_NAME" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1 || gh release create "$GITHUB_REF_NAME" -R "$GITHUB_REPOSITORY" --verify-tag --generate-notes
